name: Build and deploy HookFlow frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_BASE_PATH: /HookFlow/
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build frontend
        working-directory: frontend
        run: |
          node -e 'const value = process.env.VITE_API_BASE_URL; if (!value) throw new Error("Set the repository Actions variable VITE_API_BASE_URL to the public Render API URL ending in /api"); const url = new URL(value); if (url.protocol !== "https:" || url.pathname !== "/api" || url.search || url.hash || ["localhost", "127.0.0.1", "::1"].includes(url.hostname)) throw new Error("VITE_API_BASE_URL must be a public HTTPS API URL with the exact /api path; localhost is not allowed");'
          npm ci
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
